name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFTLINT_VERSION: 0.65.1
  SWIFTFORMAT_VERSION: 0.63.0
  XCODEGEN_VERSION: 2.46.0

jobs:
  gates:
    name: 纪律门禁（G1–G10）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned lint tools（G8，装完自校验）
        run: |
          set -euo pipefail
          brew install swiftlint swiftformat
          test "$(swiftlint version)" = "$SWIFTLINT_VERSION" || { echo "swiftlint 版本不符"; exit 1; }
          test "$(swiftformat --version)" = "$SWIFTFORMAT_VERSION" || { echo "swiftformat 版本不符"; exit 1; }
      - name: 统一构建入口（G9）
        run: bash scripts/check-build-entry.sh
      - name: 分层边界（Core 平台无关）
        run: bash scripts/check-forbidden-imports.sh
      - name: 结构硬上限（G2）
        run: bash scripts/check-structural-budget.sh check
      - name: 依赖许可（G7）
        run: bash scripts/check-dependency-licenses.sh
      - name: shell 变量展开边界（G10）
        run: bash scripts/check-shell-quoting.sh
      - name: 格式与静态检查（G8）
        run: |
          set -euo pipefail
          swiftformat --lint --quiet .
          swiftlint lint --quiet

  core-tests:
    name: Core 与契约测试（无模拟器）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: DDScannerCore 单测（G1 红利：本机可跑）
        run: |
          set -euo pipefail
          swift test --package-path Sources/DDScannerCore 2>&1 | tee "${RUNNER_TEMP:-/tmp}/core-tests.log"
          bash scripts/check-test-signal.sh "${RUNNER_TEMP:-/tmp}/core-tests.log" 35 "DDScannerCore 单测"
      - name: 契约测试（G3/G4/G5/G6）
        run: |
          set -euo pipefail
          swift test --package-path Tests 2>&1 | tee "${RUNNER_TEMP:-/tmp}/contract-tests.log"
          bash scripts/check-test-signal.sh "${RUNNER_TEMP:-/tmp}/contract-tests.log" 17 "契约测试"
      - name: DDScannerDewarp 单测（批 3 新增；本机 macOS 可跑，无模拟器）
        run: |
          set -euo pipefail
          swift test --package-path Sources/DDScannerDewarp 2>&1 | tee "${RUNNER_TEMP:-/tmp}/dewarp-tests.log"
          bash scripts/check-test-signal.sh "${RUNNER_TEMP:-/tmp}/dewarp-tests.log" 6 "DDScannerDewarp 单测"

  ios-build:
    name: iOS 编译级验证 + 零警告（G1）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned xcodegen（G9，装完自校验）
        run: |
          set -euo pipefail
          brew install xcodegen
          test "$(xcodegen --version | awk '{print $2}')" = "$XCODEGEN_VERSION" || { echo "xcodegen 版本不符：期望 ${XCODEGEN_VERSION}，实际 $(xcodegen --version)"; exit 1; }
      - name: 生成工程幂等性（G9/gen-project）
        run: |
          set -euo pipefail
          bash scripts/gen-project.sh
          git diff --exit-code -- DDScanner.xcodeproj
      - name: 构建 + 零警告
        run: bash scripts/check-zero-warnings.sh build
      - name: 测试 target 编译
        run: bash scripts/check-zero-warnings.sh build-for-testing
