# XcodeGen 工程定义（生成物 DDScanner.xcodeproj 一并入库；重新生成走 scripts/gen-project.sh）。
name: DDScanner
options:
  bundleIdPrefix: com.daxmate
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  DDScannerCore:
    path: Sources/DDScannerCore
  DDScannerVision:
    path: Sources/DDScannerVision
  DDScannerDewarp:
    path: Sources/DDScannerDewarp
  DDScannerExport:
    path: Sources/DDScannerExport

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

targets:
  DDScanner:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DDScanner
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: 用于拍摄文档并生成扫描件。
        NSPhotoLibraryUsageDescription: 用于导入相册中的文档图片。
        NSPhotoLibraryAddUsageDescription: 用于把扫描件保存回相册。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen: {}
    sources:
      - path: App
      - path: Resources
      # 模型产物作为资源随 App 打包（Xcode 会把 .mlpackage 编译成 .mlmodelc）。
      # README 只是说明文档，不进 bundle。
      - path: Models
        excludes:
          - "*.md"
    dependencies:
      - package: DDScannerCore
        product: DDScannerCore
      - package: DDScannerVision
        product: DDScannerVision
      - package: DDScannerDewarp
        product: DDScannerDewarp
      - package: DDScannerExport
        product: DDScannerExport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daxmate.DDScanner
        PRODUCT_NAME: DDScanner
        DEVELOPMENT_TEAM: B6FA37AYT5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  DDScannerContractTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ContractTests
    dependencies:
      - target: DDScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daxmate.DDScannerContractTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DDScanner:
    build:
      targets:
        DDScanner: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DDScannerContractTests
